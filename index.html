<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ルーレットアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOPページ -->
<!-- ✅ 修正①: class="page" を追加して showPage() で制御できるようにした -->
  <div id="top-page" class="page">
    <h1>ルーレットアプリ</h1>
    <button onclick="showModeSelect()">スタート</button>
  </div>

<!-- モード選択画面 -->
  <div id="mode-select" class="page hidden">
    <h2>モードを選択</h2>
    <div class="mode-buttons">
      <button onclick="startBasicMode()">ベーシック</button>
      <button onclick="startOmikujiMode()">おみくじ</button>
      <button onclick="showCustomMode()">カスタム</button>
      <button onclick="showOrderMode()">順番決め</button>
      <button onclick="backToTop()">TOPに戻る</button>
    </div>
  </div>

<!-- カスタムモード（重み付け） -->
  <div id="custom-mode" class="page hidden">
    <h2>カスタムルーレット</h2>
    
    <div class="input-section">
      <label>タイトル:</label>
      <input type="text" id="custom-title" placeholder="今日の晩ごはん">
    </div>
    
    <div class="input-section">
      <label>項目名:</label>
      <input type="text" id="item-name" placeholder="カレー">
      
      <label>重み（確率）:</label>
      <input type="number" id="item-weight" value="10" min="1">
      
      <button onclick="addCustomItemWeighted()">追加</button>
    </div>

    <div class="items-list">
      <h3>追加済み項目:</h3>
      <div id="custom-items-list"></div>
      <div id="total-weight">合計: 0</div>
    </div>
    
    <div class="action-buttons">
      <button onclick="startCustomWeightedRoulette()">ルーレット開始</button>
      <button onclick="saveCustomRoulette()">設定を保存</button>
      <button onclick="backToModeSelect()">モード選択に戻る</button>
    </div>
    
    <div class="saved-roulettes">
      <h3>保存済みルーレット:</h3>
      <div id="saved-list"></div>
    </div>

  </div>

<!-- ルーレット画面 -->
  <div id="roulette-page" class="page hidden">
    <h2 id="roulette-title">ルーレット</h2>
    
    <!-- ✅ 修正②: 矢印（ポインタ）をキャンバスの外側に配置 -->
    <div id="roulette-container">
      <div id="roulette-pointer">▼</div>
      <canvas id="roulette-canvas" width="400" height="400"></canvas>

      <div id="result" class="hidden">
        <h2>結果:</h2>
        <div id="result-text"></div>
      </div>
    </div>
    
    <div class="roulette-buttons">
      <button id="spin-button" onclick="spinRoulette()">回す！</button>

      <!-- ✅ 追加：初期状態はhiddenにしておく -->
      <button id="back-to-custom-button" class="hidden" onclick="backToCustomMode()">
        カスタム画面に戻る
      </button>

      <button onclick="backToModeSelect()">モード選択に戻る</button>
    </div>
  </div>

  <!-- 順番決めモード：メンバー入力画面 -->
<div id="order-input-page" class="page hidden">
  <h2>順番決め</h2>

  <div class="input-section">
    <label>登壇者名:</label>
    <input type="text" id="order-member-name" placeholder="例：田中">
    <button onclick="addOrderMember()">追加</button>
  </div>

  <div class="items-list">
    <h3>登壇者一覧:</h3>
    <div id="order-members-list"><p>まだ登壇者がいません</p></div>
  </div>

  <div class="action-buttons">
    <button onclick="startOrderRoulette()">順番決め開始</button>
    <button onclick="backToModeSelectFromOrder()">モード選択に戻る</button>
  </div>
</div>

<!-- 順番決めモード：ルーレット画面 -->
<div id="order-roulette-page" class="page hidden">
  <h2 id="order-roulette-title">順番決め</h2>
  <p id="order-current-member" style="font-size:1.2rem; margin-bottom:10px; color:#555;"></p>

  <div id="order-roulette-container" style="position:relative; display:inline-block; margin: 20px auto;">
    <div id="order-roulette-pointer" style="position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:2rem; color:#e74c3c; z-index:10;">▼</div>
    <canvas id="order-roulette-canvas" width="400" height="400"
      style="display:block; border:3px solid #667eea; border-radius:50%; box-shadow:0 10px 30px rgba(0,0,0,0.2);"></canvas>
    <div id="order-result" class="hidden" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.92); border-radius:15px; padding:20px 30px; width:240px; text-align:center;">
      <h2>結果:</h2>
      <div id="order-result-text" style="font-size:3rem; font-weight:bold; color:#e74c3c;"></div>
    </div>
  </div>

  <div class="roulette-buttons">
    <button id="order-spin-button" onclick="spinOrderRoulette()">回す！</button>
    <button id="order-next-button" class="hidden" onclick="nextOrderMember()">次の人へ</button>
  </div>
</div>

<!-- 順番決めモード：結果画面 -->
<div id="order-result-page" class="page hidden">
  <h2>登壇順 決定！</h2>
  <div id="order-final-result" style="margin: 20px 0;"></div>
  <div class="action-buttons">
    <button onclick="retryOrderMode()">やり直し</button>
    <button onclick="backToModeSelect()">モード選択に戻る</button>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
